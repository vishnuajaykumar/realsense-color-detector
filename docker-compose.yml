# version: "3.8" # Obsolete

services:
  detector:
    build:
      context: ..   # ~/ros2_ws/src/ — includes both packages
      dockerfile: realsense_color_detector/Dockerfile
    network_mode: host
    privileged: true
    pid: host
    devices:
      - /dev/bus/usb:/dev/bus/usb
    shm_size: '2gb'
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - /run/user/1000/gdm/Xauthority:/root/.Xauthority
      - .:/ros2_ws/src/realsense_color_detector
      - /home/vish/.cache/ros_detector:/root/.cache
      - /home/vish/.config/Ultralytics:/root/.config/Ultralytics
    environment:
      - DISPLAY=:0
      - XAUTHORITY=/root/.Xauthority
      - ROS_DOMAIN_ID=0
      - PYTHONUNBUFFERED=1

  mcp_server:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - ${HOME}/ros_mcp_server:/app
    command: >
      sh -c "pip install --no-cache-dir -e . opencv-python-headless && python server.py"
    network_mode: host
    shm_size: '2gb'
    depends_on:
      - detector
