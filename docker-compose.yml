version: "3.8"

services:
  detector:
    build:
      context: ..   # ~/ros2_ws/src/ — includes both packages
      dockerfile: realsense_color_detector/Dockerfile
    network_mode: host
    privileged: true
    devices:
      - /dev/bus/usb:/dev/bus/usb
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ./presentation/config:/ros2_ws/src/realsense_color_detector/presentation/config
    environment:
      - DISPLAY=${DISPLAY}
      - ROS_DOMAIN_ID=0

  mcp_server:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - ${HOME}/ros_mcp_server:/app
    command: >
      sh -c "pip install -e . && python server.py"
    network_mode: host
    depends_on:
      - detector
