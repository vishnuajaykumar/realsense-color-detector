detector_node:
  ros__parameters:
    model_path: /ros2_ws/yolov8s-world.pt
    imgsz: 160

    # Minimum detection confidence (0.0–1.0). Lower = more detections, more false positives.
    confidence: 0.15

    # Depth sensing parameters (Intel RealSense D435i)
    depth_scale: 0.001   # raw unit → metres (1 mm per unit, D435i default)
    min_depth_m: 0.1     # D435i minimum reliable range
    max_depth_m: 4.0     # practical detection limit

    # Camera topic overrides (defaults match realsense2_camera node)
    color_topic: /camera/color/image_raw
    depth_topic: /camera/aligned_depth_to_color/image_raw
    info_topic:  /camera/color/camera_info

camera_node:
  ros__parameters:
    color_topic: /camera/color/image_raw
    depth_topic: /camera/aligned_depth_to_color/image_raw
    info_topic:  /camera/color/camera_info
    # Ultra-low bandwidth for USB 2.0 / LattePanda
    depth_module.profile: 424,240,6
    rgb_camera.profile: 424,240,6
    enable_sync: true
    align_depth.enable: true
    enable_pointcloud: false
